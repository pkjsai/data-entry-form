<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Entry Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .printable-document {
                background: white !important;
                color: black !important;
                border: 1px solid #ccc !important;
                box-shadow: none !important;
                padding: 20px !important;
                width: 100% !important;
            }
            .signature-line {
                border-top: 1px solid #000 !important;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_URL = "https://script.google.com/macros/s/AKfycbxz_dQhvMKndcwCnZChY8etloherH7pneuSjzN7zniwMvjFLAfgEHfTqfRxmrM5i40b3g/exec";

        function App() {
            // Auth States
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [credentials, setCredentials] = useState({ userId: '', password: '' });
            const [isAuthenticating, setIsAuthenticating] = useState(false);
            const [authError, setAuthError] = useState('');

            // App Form States
            const [formData, setFormData] = useState({
                empId: '',
                fullName: '',
                department: '',
                email: '',
                eventDate: '',
                eventType: 'Meeting',
                role: 'User',
                status: 'Active',
                notes: ''
            });

            const [records, setRecords] = useState([]);
            const [lastSubmitted, setLastSubmitted] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);
            const [toast, setToast] = useState('');
            const [showConfirmModal, setShowConfirmModal] = useState(false);

            useEffect(() => {
                const sessionUser = sessionStorage.getItem('portal_user_id');
                if (sessionUser) {
                    setIsAuthenticated(true);
                }
            }, []);

            useEffect(() => {
                const saved = localStorage.getItem('user_private_records');
                if (saved) {
                    try { setRecords(JSON.parse(saved)); } catch (e) {}
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('user_private_records', JSON.stringify(records));
            }, [records]);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 4000);
            };

            // Helper: Format YYYY-MM-DD into DDMMYY
            const formatDDMMYY = (dateStr) => {
                if (!dateStr) return '';
                const parts = dateStr.split('-');
                if (parts.length === 3) {
                    const [year, month, day] = parts;
                    return `${day}${month}${year.slice(-2)}`;
                }
                return dateStr;
            };

            // Control Check: EMP ID + Event Date + Event Type
            const generateRefNumber = (empIdVal, eventDateVal, eventTypeVal, existingRecords) => {
                const baseFormattedDate = formatDDMMYY(eventDateVal);

                // Count duplicates strictly for this EMP ID + Event Date + Event Type combination
                const duplicateCount = existingRecords.filter(rec => 
                    rec.empId === empIdVal &&
                    rec.eventDate === eventDateVal && 
                    rec.eventType === eventTypeVal
                ).length;

                if (duplicateCount === 0) {
                    return baseFormattedDate;
                } else {
                    return `${baseFormattedDate}-${duplicateCount}`;
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setIsAuthenticating(true);
                setAuthError('');

                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({
                            action: 'login',
                            userId: credentials.userId,
                            password: credentials.password
                        })
                    });

                    const data = await res.json();

                    if (data.status === 'success') {
                        setIsAuthenticated(true);
                        sessionStorage.setItem('portal_user_id', credentials.userId);
                    } else {
                        setAuthError('❌ Invalid User ID or Password.');
                    }
                } catch (err) {
                    setAuthError('❌ Login verification failed. Please try again.');
                } finally {
                    setIsAuthenticating(false);
                }
            };

            const handleLogout = () => {
                sessionStorage.removeItem('portal_user_id');
                setIsAuthenticated(false);
                setCredentials({ userId: '', password: '' });
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleEmpIdChange = (e) => {
                const numericValue = e.target.value.replace(/\D/g, '');
                setFormData(prev => ({ ...prev, empId: numericValue }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();

                if (!formData.fullName || !formData.email || !formData.empId || !formData.eventDate) {
                    showToast('⚠️ Please fill in all required fields including Event Date.');
                    return;
                }

                setIsSyncing(true);
                const timestamp = new Date().toLocaleString();

                // Generate Ref No isolated per EMP ID
                const refNumber = generateRefNumber(
                    formData.empId, 
                    formData.eventDate, 
                    formData.eventType, 
                    records
                );

                const newRecord = { 
                    id: Date.now(), 
                    refNumber, 
                    timestamp, 
                    ...formData 
                };

                try {
                    await fetch(API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({
                            action: 'submit',
                            refNumber: refNumber,
                            eventDate: formData.eventDate,
                            eventType: formData.eventType,
                            empId: formData.empId,
                            fullName: formData.fullName,
                            department: formData.department,
                            email: formData.email,
                            role: formData.role,
                            status: formData.status,
                            notes: formData.notes
                        })
                    });

                    setRecords(prev => [newRecord, ...prev]);
                    setLastSubmitted(newRecord);
                    showToast(`✅ Synced! Generated Ref No: ${refNumber}`);

                    setFormData({
                        empId: '',
                        fullName: '',
                        department: '',
                        email: '',
                        eventDate: '',
                        eventType: 'Meeting',
                        role: 'User',
                        status: 'Active',
                        notes: ''
                    });
                } catch (err) {
                    showToast('❌ Error submitting data.');
                } finally {
                    setIsSyncing(false);
                }
            };

            const handlePrint = () => {
                window.print();
            };

            const confirmClearRecords = () => {
                setRecords([]);
                setLastSubmitted(null);
                localStorage.removeItem('user_private_records');
                setShowConfirmModal(false);
                showToast('🧹 Your local history has been cleared!');
            };

            const exportToExcel = () => {
                if (records.length === 0) {
                    showToast('⚠️ No records to export!');
                    return;
                }
                const exportData = records.map(({ id, ...rest }) => rest);
                const worksheet = XLSX.utils.json_to_sheet(exportData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "My Submissions");
                XLSX.writeFile(workbook, "My_Submissions_Export.xlsx");
                showToast('📊 Exported to Excel successfully!');
            };

            if (!isAuthenticated) {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-md w-full shadow-2xl">
                            <div className="flex flex-col items-center mb-6">
                                <img 
                                    src="logo.png" 
                                    alt="Logo" 
                                    className="h-12 w-auto mb-3 object-contain rounded bg-white p-1 shadow"
                                    onError={(e) => { e.target.style.display = 'none'; }}
                                />
                                <h2 className="text-xl font-bold text-cyan-400">Portal Access Required</h2>
                                <p className="text-xs text-slate-400 mt-1">Sign in with your credentials</p>
                            </div>

                            {authError && (
                                <div className="mb-4 bg-rose-900/40 border border-rose-500/50 text-rose-300 text-xs p-3 rounded text-center">
                                    {authError}
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div className="flex items-center space-x-3">
                                    <label className="w-24 text-sm font-semibold text-slate-300">User ID:</label>
                                    <input 
                                        type="text" 
                                        required
                                        value={credentials.userId}
                                        onChange={(e) => setCredentials(p => ({ ...p, userId: e.target.value }))}
                                        className="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                        placeholder="Enter User ID"
                                    />
                                </div>

                                <div className="flex items-center space-x-3">
                                    <label className="w-24 text-sm font-semibold text-slate-300">Password:</label>
                                    <input 
                                        type="password" 
                                        required
                                        value={credentials.password}
                                        onChange={(e) => setCredentials(p => ({ ...p, password: e.target.value }))}
                                        className="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                        placeholder="Enter Password"
                                    />
                                </div>

                                <button 
                                    type="submit"
                                    disabled={isAuthenticating}
                                    className="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 rounded transition-all shadow-lg disabled:opacity-50 text-sm mt-4"
                                >
                                    {isAuthenticating ? 'Verifying Credentials...' : 'Sign In'}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-4xl mx-auto p-6">
                    <div className="flex justify-between items-center mb-6 no-print">
                        <h1 className="text-2xl font-bold text-cyan-400">
                            Data Entry & Google Sheet Sync
                        </h1>
                        <div className="flex items-center space-x-3">
                            {records.length > 0 && (
                                <button 
                                    type="button"
                                    onClick={() => setShowConfirmModal(true)}
                                    className="bg-rose-600 hover:bg-rose-500 text-xs font-semibold px-3 py-2 rounded transition-all text-white shadow"
                                >
                                    🗑️ Clear History
                                </button>
                            )}
                            <button 
                                type="button"
                                onClick={exportToExcel}
                                className="bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold px-4 py-2 rounded transition-all text-white shadow"
                            >
                                📊 Export Excel
                            </button>
                            <button 
                                type="button"
                                onClick={handleLogout}
                                className="bg-slate-700 hover:bg-slate-600 text-xs font-semibold px-3 py-2 rounded transition-all text-slate-200 border border-slate-600 shadow"
                            >
                                🚪 Logout
                            </button>
                            <img 
                                src="logo.png" 
                                alt="Logo" 
                                className="h-10 w-auto object-contain rounded bg-white p-1 shadow"
                                onError={(e) => { e.target.style.display = 'none'; }}
                            />
                        </div>
                    </div>

                    {toast && (
                        <div className="fixed top-5 right-5 bg-slate-800 border border-cyan-500 text-slate-100 px-4 py-3 rounded shadow-2xl z-50 animate-bounce text-sm no-print">
                            {toast}
                        </div>
                    )}

                    {showConfirmModal && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4 no-print">
                            <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-sm w-full shadow-2xl space-y-4">
                                <div className="flex items-center space-x-3">
                                    <div className="p-2 bg-rose-500/20 text-rose-400 rounded-lg">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                                        </svg>
                                    </div>
                                    <h3 className="text-lg font-bold text-white">Clear Local History?</h3>
                                </div>
                                <p className="text-sm text-slate-300">This will clear your local view.</p>
                                <div className="flex justify-end space-x-3 pt-2">
                                    <button 
                                        type="button"
                                        onClick={() => setShowConfirmModal(false)}
                                        className="px-4 py-2 rounded text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-200 transition-all"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        type="button"
                                        onClick={confirmClearRecords}
                                        className="px-4 py-2 rounded text-xs font-semibold bg-rose-600 hover:bg-rose-500 text-white transition-all shadow"
                                    >
                                        Yes, Clear
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Form Section */}
                    <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl mb-8 no-print">
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm text-slate-300 mb-1">Event Date *</label>
                                    <input 
                                        type="date" 
                                        name="eventDate" 
                                        value={formData.eventDate} 
                                        onChange={handleChange} 
                                        required
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm text-slate-300 mb-1">Event Type *</label>
                                    <select 
                                        name="eventType" 
                                        value={formData.eventType} 
                                        onChange={handleChange} 
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500"
                                    >
                                        <option value="Meeting">Meeting</option>
                                        <option value="Inspection">Inspection</option>
                                        <option value="Training">Training</option>
                                        <option value="Audit">Audit</option>
                                    </select>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
                                <div className="sm:col-span-1">
                                    <label className="block text-sm text-slate-300 mb-1">EMP ID *</label>
                                    <input 
                                        type="text" 
                                        name="empId" 
                                        value={formData.empId} 
                                        onChange={handleEmpIdChange}
                                        maxLength={9}
                                        inputMode="numeric"
                                        placeholder="e.g. 123456789"
                                        required
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 tracking-wider font-mono"
                                    />
                                </div>
                                <div className="sm:col-span-1">
                                    <label className="block text-sm text-slate-300 mb-1">Full Name *</label>
                                    <input 
                                        type="text" 
                                        name="fullName" 
                                        value={formData.fullName} 
                                        onChange={handleChange} 
                                        required
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500"
                                    />
                                </div>
                                <div className="sm:col-span-1">
                                    <label className="block text-sm text-slate-300 mb-1">Department</label>
                                    <input 
                                        type="text" 
                                        name="department" 
                                        value={formData.department} 
                                        onChange={handleChange} 
                                        placeholder="e.g. Engineering"
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500"
                                    />
                                </div>
                                <div className="sm:col-span-1">
                                    <label className="block text-sm text-slate-300 mb-1">Email Address *</label>
                                    <input 
                                        type="email" 
                                        name="email" 
                                        value={formData.email} 
                                        onChange={handleChange} 
                                        required
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500"
                                    />
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm text-slate-300 mb-1">Role</label>
                                    <select name="role" value={formData.role} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500">
                                        <option value="Admin">Admin</option>
                                        <option value="User">User</option>
                                        <option value="Manager">Manager</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm text-slate-300 mb-1">Status</label>
                                    <select name="status" value={formData.status} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500">
                                        <option value="Active">Active</option>
                                        <option value="Inactive">Inactive</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm text-slate-300 mb-1">Notes</label>
                                <textarea name="notes" value={formData.notes} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500" rows="2"></textarea>
                            </div>

                            <button 
                                type="submit" 
                                disabled={isSyncing}
                                className="w-full bg-cyan-600 hover:bg-cyan-500 font-bold py-2.5 rounded transition-all text-white shadow-lg disabled:opacity-50"
                            >
                                {isSyncing ? 'Syncing to Sheet...' : 'Submit & Sync Data'}
                            </button>
                        </form>
                    </div>

                    {/* PRINTABLE RECEIPT CARD */}
                    {lastSubmitted && (
                        <div className="printable-document bg-slate-800 p-6 rounded-xl border border-cyan-500/50 shadow-2xl mb-8">
                            <div className="flex justify-between items-center pb-4 border-b border-slate-700 mb-4">
                                <div>
                                    <h2 className="text-xl font-bold text-cyan-400">Submission Receipt</h2>
                                    <p className="text-sm font-bold text-white mt-1">
                                        Ref No: <span className="font-mono text-cyan-300 text-base">{lastSubmitted.refNumber}</span>
                                    </p>
                                    <p className="text-xs text-slate-400">Submitted: {lastSubmitted.timestamp}</p>
                                </div>
                                <button 
                                    type="button" 
                                    onClick={handlePrint}
                                    className="no-print bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-4 py-2 rounded text-sm transition-all shadow flex items-center space-x-2"
                                >
                                    <span>🖨️ Save as PDF / Print</span>
                                </button>
                            </div>

                            <div className="grid grid-cols-2 gap-4 text-sm mb-6">
                                <div><strong className="text-slate-400">EMP ID:</strong> <span className="text-white font-mono">{lastSubmitted.empId}</span></div>
                                <div><strong className="text-slate-400">Full Name:</strong> <span className="text-white">{lastSubmitted.fullName}</span></div>
                                <div><strong className="text-slate-400">Event Date:</strong> <span className="text-white">{lastSubmitted.eventDate}</span></div>
                                <div><strong className="text-slate-400">Event Type:</strong> <span className="text-white">{lastSubmitted.eventType}</span></div>
                                <div><strong className="text-slate-400">Department:</strong> <span className="text-white">{lastSubmitted.department || 'N/A'}</span></div>
                                <div><strong className="text-slate-400">Email:</strong> <span className="text-white">{lastSubmitted.email}</span></div>
                                <div><strong className="text-slate-400">Role:</strong> <span className="text-white">{lastSubmitted.role}</span></div>
                                <div><strong className="text-slate-400">Status:</strong> <span className="text-white">{lastSubmitted.status}</span></div>
                                <div className="col-span-2"><strong className="text-slate-400">Notes:</strong> <span className="text-white">{lastSubmitted.notes || 'None'}</span></div>
                            </div>

                            {/* SIGNATURE SECTION BEFORE FOOTER */}
                            <div className="mt-12 pt-8 border-t border-slate-700 grid grid-cols-2 gap-12 text-center">
                                <div>
                                    <div className="signature-line border-t border-slate-500 pt-2 text-xs font-semibold uppercase text-slate-300">
                                        User Signature
                                    </div>
                                    <p className="text-[10px] text-slate-400 mt-1">{lastSubmitted.fullName}</p>
                                </div>
                                <div>
                                    <div className="signature-line border-t border-slate-500 pt-2 text-xs font-semibold uppercase text-slate-300">
                                        Manager Signature
                                    </div>
                                    <p className="text-[10px] text-slate-400 mt-1">Approval Signature & Date</p>
                                </div>
                            </div>

                            {/* FOOTER */}
                            <div className="mt-8 text-center text-[10px] text-slate-500 border-t border-slate-700/50 pt-3">
                                Official Verification Record • Ref: {lastSubmitted.refNumber} • Generated by Data Entry Portal
                            </div>
                        </div>
                    )}

                    {/* RECORDS HISTORY TABLE */}
                    {records.length > 0 && (
                        <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl no-print">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-lg font-bold text-slate-200">My Submitted Records</h2>
                                <span className="text-xs text-slate-400">Private to your browser</span>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm text-left text-slate-300">
                                    <thead className="text-xs uppercase bg-slate-900 text-slate-400">
                                        <tr>
                                            <th className="px-4 py-3">Ref No</th>
                                            <th className="px-4 py-3">EMP ID</th>
                                            <th className="px-4 py-3">Event Date</th>
                                            <th className="px-4 py-3">Event Type</th>
                                            <th className="px-4 py-3">Name</th>
                                            <th className="px-4 py-3">Department</th>
                                            <th className="px-4 py-3">Role</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-700">
                                        {records.map((rec) => (
                                            <tr key={rec.id} className="hover:bg-slate-750">
                                                <td className="px-4 py-3 font-semibold text-cyan-400 font-mono">{rec.refNumber}</td>
                                                <td className="px-4 py-3 font-mono">{rec.empId}</td>
                                                <td className="px-4 py-3 text-xs">{rec.eventDate}</td>
                                                <td className="px-4 py-3 text-xs">{rec.eventType}</td>
                                                <td className="px-4 py-3 font-medium text-white">{rec.fullName}</td>
                                                <td className="px-4 py-3">{rec.department}</td>
                                                <td className="px-4 py-3">{rec.role}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
