<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Entry Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- PDF Generation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const API_URL = "https://script.google.com/macros/s/AKfycbxz_dQhvMKndcwCnZChY8etloherH7pneuSjzN7zniwMvjFLAfgEHfTqfRxmrM5i40b3g/exec";

        function App() {
            // Auth States
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [credentials, setCredentials] = useState({ userId: '', password: '' });
            const [isAuthenticating, setIsAuthenticating] = useState(false);
            const [authError, setAuthError] = useState('');

            // App Form States
            const [formData, setFormData] = useState({
                empId: '',
                fullName: '',
                department: '',
                email: '',
                location: '',
                eventType: '',
                beneficiaryCategory: '',
                contributionAmt: '',
                eventDate: '',
                beneficiaryName: '',
                notes: ''
            });

            const [records, setRecords] = useState([]);
            const [isSyncing, setIsSyncing] = useState(false);
            const [isFetchingEmp, setIsFetchingEmp] = useState(false);
            const [toast, setToast] = useState('');
            const [showConfirmModal, setShowConfirmModal] = useState(false);
            const [pdfData, setPdfData] = useState(null); // Selected record for PDF download

            // Maintain session state on refresh
            useEffect(() => {
                const sessionUser = sessionStorage.getItem('portal_user_id');
                if (sessionUser) {
                    setIsAuthenticated(true);
                }
            }, []);

            // Local browser storage for record isolation
            useEffect(() => {
                const saved = localStorage.getItem('user_private_records');
                if (saved) {
                    try { setRecords(JSON.parse(saved)); } catch (e) {}
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('user_private_records', JSON.stringify(records));
            }, [records]);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 4000);
            };

            // Login Logic
            const handleLogin = async (e) => {
                e.preventDefault();
                setIsAuthenticating(true);
                setAuthError('');

                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({
                            action: 'login',
                            userId: credentials.userId,
                            password: credentials.password
                        })
                    });

                    const data = await res.json();

                    if (data.status === 'success') {
                        setIsAuthenticated(true);
                        sessionStorage.setItem('portal_user_id', credentials.userId);
                    } else {
                        setAuthError('❌ Invalid User ID or Password.');
                    }
                } catch (err) {
                    setAuthError('❌ Login verification failed. Please try again.');
                } finally {
                    setIsAuthenticating(false);
                }
            };

            const handleLogout = () => {
                sessionStorage.removeItem('portal_user_id');
                setIsAuthenticated(false);
                setCredentials({ userId: '', password: '' });
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            // Enforce numeric only input for EMP ID
            const handleEmpIdChange = (e) => {
                const numericValue = e.target.value.replace(/\D/g, '');
                setFormData(prev => ({ ...prev, empId: numericValue }));
            };

            // Fetch Employee Name using EMP ID
            const handleFetchData = async () => {
                if (!formData.empId) {
                    showToast('⚠️ Please enter an EMP ID first.');
                    return;
                }

                setIsFetchingEmp(true);
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({
                            action: 'getEmpName',
                            empId: formData.empId
                        })
                    });
                    const data = await res.json();
                    if (data.status === 'success' && data.empFullName) {
                        setFormData(prev => ({ ...prev, fullName: data.empFullName }));
                        showToast('✅ Employee data fetched!');
                    } else {
                        showToast('⚠️ Employee record not found.');
                    }
                } catch (err) {
                    showToast('❌ Error fetching employee data.');
                } finally {
                    setIsFetchingEmp(false);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();

                if (!formData.fullName || !formData.email || !formData.empId) {
                    showToast('⚠️ Please fill in all required fields.');
                    return;
                }

                setIsSyncing(true);
                const timestamp = new Date().toLocaleString();
                const newRecord = { id: Date.now(), timestamp, ...formData };

                try {
                    await fetch(API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({
                            action: 'submit',
                            empId: formData.empId,
                            fullName: formData.fullName,
                            department: formData.department,
                            email: formData.email,
                            location: formData.location,
                            eventType: formData.eventType,
                            beneficiaryCategory: formData.beneficiaryCategory,
                            contributionAmt: formData.contributionAmt,
                            eventDate: formData.eventDate,
                            beneficiaryName: formData.beneficiaryName,
                            notes: formData.notes
                        })
                    });

                    setRecords(prev => [newRecord, ...prev]);
                    showToast('✅ Synced to Google Sheet successfully!');
                    
                    // Show PDF download preview modal
                    setPdfData(newRecord);

                    setFormData({
                        empId: '',
                        fullName: '',
                        department: '',
                        email: '',
                        location: '',
                        eventType: '',
                        beneficiaryCategory: '',
                        contributionAmt: '',
                        eventDate: '',
                        beneficiaryName: '',
                        notes: ''
                    });
                } catch (err) {
                    showToast('❌ Error submitting data.');
                } finally {
                    setIsSyncing(false);
                }
            };

            // Download Generated PDF Handler
            const downloadPDF = () => {
                if (!pdfData) return;
                const element = document.getElementById('pdf-content');
                const opt = {
                    margin:       0.4,
                    filename:     `Claim_Form_${pdfData.empId}_${pdfData.id}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2 },
                    jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
                };

                html2pdf().set(opt).from(element).save();
            };

            const confirmClearRecords = () => {
                setRecords([]);
                localStorage.removeItem('user_private_records');
                setShowConfirmModal(false);
                showToast('🧹 Your local history has been cleared!');
            };

            const exportToExcel = () => {
                if (records.length === 0) {
                    showToast('⚠️ No records to export!');
                    return;
                }
                const exportData = records.map(({ id, ...rest }) => rest);
                const worksheet = XLSX.utils.json_to_sheet(exportData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "My Submissions");
                XLSX.writeFile(workbook, "My_Submissions_Export.xlsx");
                showToast('📊 Exported to Excel successfully!');
            };

            // RENDER LOGIN SCREEN IF NOT AUTHENTICATED
            if (!isAuthenticated) {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-md w-full shadow-2xl">
                            <div className="flex flex-col items-center mb-6">
                                <img 
                                    src="logo.png" 
                                    alt="Logo" 
                                    className="h-12 w-auto mb-3 object-contain rounded bg-white p-1 shadow"
                                    onError={(e) => { e.target.style.display = 'none'; }}
                                />
                                <h2 className="text-xl font-bold text-cyan-400">Portal Access Required</h2>
                                <p className="text-xs text-slate-400 mt-1">Sign in with your credentials</p>
                            </div>

                            {authError && (
                                <div className="mb-4 bg-rose-900/40 border border-rose-500/50 text-rose-300 text-xs p-3 rounded text-center">
                                    {authError}
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div className="flex items-center space-x-3">
                                    <label className="w-24 text-sm font-semibold text-slate-300">User ID:</label>
                                    <input 
                                        type="text" 
                                        required
                                        value={credentials.userId}
                                        onChange={(e) => setCredentials(p => ({ ...p, userId: e.target.value }))}
                                        className="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                        placeholder="Enter User ID"
                                    />
                                </div>

                                <div className="flex items-center space-x-3">
                                    <label className="w-24 text-sm font-semibold text-slate-300">Password:</label>
                                    <input 
                                        type="password" 
                                        required
                                        value={credentials.password}
                                        onChange={(e) => setCredentials(p => ({ ...p, password: e.target.value }))}
                                        className="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                        placeholder="Enter Password"
                                    />
                                </div>

                                <button 
                                    type="submit"
                                    disabled={isAuthenticating}
                                    className="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 rounded transition-all shadow-lg disabled:opacity-50 text-sm mt-4"
                                >
                                    {isAuthenticating ? 'Verifying Credentials...' : 'Sign In'}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // RENDER MAIN APPLICATION FORM AFTER AUTHENTICATION
            return (
                <div className="max-w-4xl mx-auto p-6">
                    <div className="flex justify-between items-center mb-6">
                        <h1 className="text-2xl font-bold text-cyan-400">
                            Sales Promotion cmail..
                        </h1>
                        <div className="flex items-center space-x-3">
                            {records.length > 0 && (
                                <button 
                                    type="button"
                                    onClick={() => setShowConfirmModal(true)}
                                    className="bg-rose-600 hover:bg-rose-500 text-xs font-semibold px-3 py-2 rounded transition-all text-white shadow"
                                >
                                    🗑️ Clear My History
                                </button>
                            )}
                            <button 
                                type="button"
                                onClick={exportToExcel}
                                className="bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold px-4 py-2 rounded transition-all text-white shadow"
                            >
                                📊 Export Excel
                            </button>
                            <button 
                                type="button"
                                onClick={handleLogout}
                                className="bg-slate-700 hover:bg-slate-600 text-xs font-semibold px-3 py-2 rounded transition-all text-slate-200 border border-slate-600 shadow"
                            >
                                🚪 Logout
                            </button>
                            <img 
                                src="logo.png" 
                                alt="Logo" 
                                className="h-10 w-auto object-contain rounded bg-white p-1 shadow"
                                onError={(e) => { e.target.style.display = 'none'; }}
                            />
                        </div>
                    </div>

                    {toast && (
                        <div className="fixed top-5 right-5 bg-slate-800 border border-cyan-500 text-slate-100 px-4 py-3 rounded shadow-2xl z-50 animate-bounce text-sm">
                            {toast}
                        </div>
                    )}

                    {/* CONFIRM CLEAR MODAL */}
                    {showConfirmModal && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-sm w-full shadow-2xl space-y-4">
                                <div className="flex items-center space-x-3">
                                    <div className="p-2 bg-rose-500/20 text-rose-400 rounded-lg">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                                        </svg>
                                    </div>
                                    <h3 className="text-lg font-bold text-white">Clear Local History?</h3>
                                </div>
                                <p className="text-sm text-slate-300">This will clear your local view.</p>
                                <div className="flex justify-end space-x-3 pt-2">
                                    <button 
                                        type="button"
                                        onClick={() => setShowConfirmModal(false)}
                                        className="px-4 py-2 rounded text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-200 transition-all"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        type="button"
                                        onClick={confirmClearRecords}
                                        className="px-4 py-2 rounded text-xs font-semibold bg-rose-600 hover:bg-rose-500 text-white transition-all shadow"
                                    >
                                        Yes, Clear
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* PRINTABLE PDF MODAL */}
                    {pdfData && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 overflow-y-auto">
                            <div className="bg-slate-800 border border-slate-700 rounded-xl max-w-2xl w-full p-6 space-y-4 shadow-2xl">
                                <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                                    <h3 className="text-lg font-bold text-cyan-400">Printable Submission Receipt</h3>
                                    <div className="flex space-x-2">
                                        <button 
                                            type="button"
                                            onClick={downloadPDF}
                                            className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded transition-all shadow flex items-center space-x-1"
                                        >
                                            <span>📥</span>
                                            <span>Download PDF</span>
                                        </button>
                                        <button 
                                            type="button"
                                            onClick={() => setPdfData(null)}
                                            className="bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs font-bold px-3 py-2 rounded"
                                        >
                                            Close
                                        </button>
                                    </div>
                                </div>

                                {/* PDF EXPORT CONTENT AREA */}
                                <div id="pdf-content" className="bg-white text-slate-900 p-8 rounded shadow text-sm space-y-6">
                                    <div className="flex justify-between items-center border-b pb-4">
                                        <div>
                                            <h2 className="text-xl font-bold text-slate-800">SALES PROMOTION CLAIM SUBMISSION FORM</h2>
                                            <p className="text-xs text-slate-500 mt-0.5">Submitted On: {pdfData.timestamp}</p>
                                        </div>
                                        <div className="text-right text-xs text-slate-500 font-mono">
                                            <p>REF NO: #{pdfData.id}</p>
                                        </div>
                                    </div>

                                    {/* Data Fields Layout */}
                                    <div className="grid grid-cols-2 gap-y-3 gap-x-6 text-xs text-slate-800 border-b pb-4">
                                        <div><strong>EMP ID:</strong> {pdfData.empId}</div>
                                        <div><strong>Full Name:</strong> {pdfData.fullName}</div>
                                        <div><strong>Department:</strong> {pdfData.department || '-'}</div>
                                        <div><strong>Email:</strong> {pdfData.email}</div>
                                        <div><strong>Location:</strong> {pdfData.location || '-'}</div>
                                        <div><strong>Event Type:</strong> {pdfData.eventType || '-'}</div>
                                        <div><strong>Beneficiary Category:</strong> {pdfData.beneficiaryCategory || '-'}</div>
                                        <div><strong>Contribution Amt:</strong> {pdfData.contributionAmt ? `₹${pdfData.contributionAmt}` : '-'}</div>
                                        <div><strong>Event Date:</strong> {pdfData.eventDate || '-'}</div>
                                        <div><strong>Beneficiary Name:</strong> {pdfData.beneficiaryName || '-'}</div>
                                    </div>

                                    {pdfData.notes && (
                                        <div className="text-xs bg-slate-50 p-3 rounded border border-slate-200">
                                            <strong className="text-slate-700">Notes:</strong> {pdfData.notes}
                                        </div>
                                    )}

                                    {/* DECLARATION STATEMENT */}
                                    <div className="border border-slate-300 rounded p-4 bg-slate-50 space-y-1 my-4">
                                        <h4 className="font-bold text-xs uppercase text-slate-800">Declaration</h4>
                                        <p className="text-xs text-slate-700 italic leading-relaxed">
                                            **Declaration: I declare that this is not a duplicate claim and has not been claimed previously..
                                        </p>
                                    </div>

                                    {/* USER AND MANAGER SIGNATURE SECTION */}
                                    <div className="flex justify-between items-end pt-12 text-xs">
                                        <div className="text-center w-48">
                                            <div className="border-b border-slate-400 mb-1"></div>
                                            <p className="font-semibold text-slate-800">User Signature</p>
                                            <p className="text-[10px] text-slate-500">({pdfData.fullName})</p>
                                        </div>
                                        <div className="text-center w-48">
                                            <div className="border-b border-slate-400 mb-1"></div>
                                            <p className="font-semibold text-slate-800">Manager Signature</p>
                                            <p className="text-[10px] text-slate-500">(Verification & Approval)</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* FORM CONTAINER */}
                    <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl mb-8">
                        <form onSubmit={handleSubmit} className="space-y-4">
                            
                            {/* FETCH DATA BUTTON ABOVE EMP ID */}
                            <div className="flex items-center justify-between">
                                <button 
                                    type="button"
                                    onClick={handleFetchData}
                                    disabled={isFetchingEmp}
                                    className="bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold px-3 py-1.5 rounded transition-all shadow flex items-center space-x-1.5 disabled:opacity-50"
                                >
                                    <span>🔍</span>
                                    <span>{isFetchingEmp ? 'Fetching Data...' : 'Fetch Data'}</span>
                                </button>
                            </div>

                            {/* ROW 1: EMP ID, Full Name, Department, Email */}
                            <div className="flex flex-wrap items-center gap-3">
                                <div className="w-full sm:w-32">
                                    <label className="block text-sm text-slate-300 mb-1">EMP ID *</label>
                                    <input 
                                        type="text" 
                                        name="empId" 
                                        value={formData.empId} 
                                        onChange={handleEmpIdChange}
                                        maxLength={9}
                                        inputMode="numeric"
                                        placeholder="e.g. 123456789"
                                        required
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 tracking-wider font-mono text-sm"
                                    />
                                </div>

                                <div className="w-full sm:flex-1 min-w-[170px]">
                                    <label className="block text-sm text-slate-300 mb-1">Full Name *</label>
                                    <input 
                                        type="text" 
                                        name="fullName" 
                                        value={formData.fullName} 
                                        onChange={handleChange} 
                                        required
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                    />
                                </div>

                                <div className="w-full sm:flex-1 min-w-[160px]">
                                    <label className="block text-sm text-slate-300 mb-1">Department</label>
                                    <input 
                                        type="text" 
                                        name="department" 
                                        value={formData.department} 
                                        onChange={handleChange} 
                                        placeholder="e.g. Engineering"
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                    />
                                </div>

                                <div className="w-full sm:flex-[1.2] min-w-[210px]">
                                    <label className="block text-sm text-slate-300 mb-1">Email Address *</label>
                                    <input 
                                        type="email" 
                                        name="email" 
                                        value={formData.email} 
                                        onChange={handleChange} 
                                        required
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                    />
                                </div>
                            </div>

                            {/* ROW 2: Location, Event Type, Beneficiary Category Dropdowns */}
                            <div className="flex flex-wrap items-center gap-3 pt-1">
                                <div className="w-full sm:flex-1 min-w-[180px]">
                                    <label className="block text-sm text-slate-300 mb-1">Location</label>
                                    <select 
                                        name="location" 
                                        value={formData.location} 
                                        onChange={handleChange} 
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                    >
                                        <option value="">Select Location</option>
                                        <option value="Headquarters">Headquarters</option>
                                        <option value="Branch Office">Branch Office</option>
                                        <option value="Remote">Remote</option>
                                        <option value="On-Site">On-Site</option>
                                    </select>
                                </div>

                                <div className="w-full sm:flex-1 min-w-[180px]">
                                    <label className="block text-sm text-slate-300 mb-1">Event Type</label>
                                    <select 
                                        name="eventType" 
                                        value={formData.eventType} 
                                        onChange={handleChange} 
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                    >
                                        <option value="">Select Event Type</option>
                                        <option value="Training">Training</option>
                                        <option value="Workshop">Workshop</option>
                                        <option value="Seminar">Seminar</option>
                                        <option value="CSR Drive">CSR Drive</option>
                                    </select>
                                </div>

                                <div className="w-full sm:flex-1 min-w-[180px]">
                                    <label className="block text-sm text-slate-300 mb-1">Beneficiary Category</label>
                                    <select 
                                        name="beneficiaryCategory" 
                                        value={formData.beneficiaryCategory} 
                                        onChange={handleChange} 
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                    >
                                        <option value="">Select Category</option>
                                        <option value="Internal Employees">Internal Employees</option>
                                        <option value="Students">Students</option>
                                        <option value="Community Members">Community Members</option>
                                        <option value="Vendors">Vendors</option>
                                    </select>
                                </div>
                            </div>

                            {/* ROW 3: Contribution Amt, Event Date (DD.MM.YY), Beneficiary Name */}
                            <div className="flex flex-wrap items-center gap-3 pt-1">
                                <div className="w-full sm:flex-1 min-w-[180px]">
                                    <label className="block text-sm text-slate-300 mb-1">Contribution Amt</label>
                                    <input 
                                        type="number" 
                                        name="contributionAmt" 
                                        value={formData.contributionAmt} 
                                        onChange={handleChange} 
                                        placeholder="e.g. 5000"
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                    />
                                </div>

                                <div className="w-full sm:flex-1 min-w-[180px]">
                                    <label className="block text-sm text-slate-300 mb-1">Event Date</label>
                                    <input 
                                        type="text" 
                                        name="eventDate" 
                                        value={formData.eventDate} 
                                        onChange={handleChange} 
                                        placeholder="DD.MM.YY"
                                        maxLength={8}
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm font-mono tracking-wider"
                                    />
                                </div>

                                <div className="w-full sm:flex-1 min-w-[180px]">
                                    <label className="block text-sm text-slate-300 mb-1">Beneficiary Name</label>
                                    <input 
                                        type="text" 
                                        name="beneficiaryName" 
                                        value={formData.beneficiaryName} 
                                        onChange={handleChange} 
                                        placeholder="Enter Name"
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm"
                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm text-slate-300 mb-1">Notes</label>
                                <textarea name="notes" value={formData.notes} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500 text-sm" rows="2"></textarea>
                            </div>

                            <button 
                                type="submit" 
                                disabled={isSyncing}
                                className="w-full bg-cyan-600 hover:bg-cyan-500 font-bold py-2.5 rounded transition-all text-white shadow-lg disabled:opacity-50 text-sm"
                            >
                                {isSyncing ? 'Syncing to Sheet...' : 'Submit & Sync Data'}
                            </button>
                        </form>
                    </div>

                    {/* SUBMITTED RECORDS TABLE */}
                    {records.length > 0 && (
                        <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-lg font-bold text-slate-200">My Submitted Records</h2>
                                <span className="text-xs text-slate-400">Private to your browser</span>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm text-left text-slate-300">
                                    <thead className="text-xs uppercase bg-slate-900 text-slate-400">
                                        <tr>
                                            <th className="px-4 py-3">Timestamp</th>
                                            <th className="px-4 py-3">EMP ID</th>
                                            <th className="px-4 py-3">Name</th>
                                            <th className="px-4 py-3">Department</th>
                                            <th className="px-4 py-3">Email</th>
                                            <th className="px-4 py-3">Location</th>
                                            <th className="px-4 py-3">Event Type</th>
                                            <th className="px-4 py-3">Category</th>
                                            <th className="px-4 py-3">Amt</th>
                                            <th className="px-4 py-3">Date</th>
                                            <th className="px-4 py-3">Beneficiary</th>
                                            <th className="px-4 py-3 text-center">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-700">
                                        {records.map((rec) => (
                                            <tr key={rec.id} className="hover:bg-slate-750">
                                                <td className="px-4 py-3 text-xs text-slate-400">{rec.timestamp}</td>
                                                <td className="px-4 py-3 font-semibold text-cyan-400 font-mono">{rec.empId}</td>
                                                <td className="px-4 py-3 font-medium text-white">{rec.fullName}</td>
                                                <td className="px-4 py-3">{rec.department}</td>
                                                <td className="px-4 py-3">{rec.email}</td>
                                                <td className="px-4 py-3">{rec.location || '-'}</td>
                                                <td className="px-4 py-3">{rec.eventType || '-'}</td>
                                                <td className="px-4 py-3">{rec.beneficiaryCategory || '-'}</td>
                                                <td className="px-4 py-3 font-mono">{rec.contributionAmt || '-'}</td>
                                                <td className="px-4 py-3 font-mono text-xs">{rec.eventDate || '-'}</td>
                                                <td className="px-4 py-3">{rec.beneficiaryName || '-'}</td>
                                                <td className="px-4 py-3 text-center">
                                                    <button 
                                                        type="button"
                                                        onClick={() => setPdfData(rec)}
                                                        className="bg-cyan-900/60 hover:bg-cyan-800 text-cyan-300 text-xs font-semibold px-2.5 py-1 rounded border border-cyan-700/60 transition-all shadow"
                                                    >
                                                        📄 PDF
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
