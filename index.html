<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Entry Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // PASTE YOUR WEB APP EXEC URL HERE
        const API_URL = "https://script.google.com/macros/s/AKfycbxz_dQhvMKndcwCnZChY8etloherH7pneuSjzN7zniwMvjFLAfgEHfTqfRxmrM5i40b3g/exec";

        function App() {
            const [formData, setFormData] = useState({
                fullName: '',
                email: '',
                role: 'User',
                department: 'Engineering',
                status: 'Active',
                notes: ''
            });

            const [records, setRecords] = useState([]);
            const [isSyncing, setIsSyncing] = useState(false);
            const [toast, setToast] = useState('');
            const [showConfirmModal, setShowConfirmModal] = useState(false);

            // Load records specific to this user/device
            useEffect(() => {
                const saved = localStorage.getItem('user_private_records');
                if (saved) {
                    try { setRecords(JSON.parse(saved)); } catch (e) {}
                }
            }, []);

            // Save records to this user's local storage only
            useEffect(() => {
                localStorage.setItem('user_private_records', JSON.stringify(records));
            }, [records]);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 4000);
            };

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();

                if (!formData.fullName || !formData.email) {
                    showToast('⚠️ Please fill in all required fields.');
                    return;
                }

                setIsSyncing(true);
                const timestamp = new Date().toLocaleString();
                const newRecord = { id: Date.now(), timestamp, ...formData };

                try {
                    await fetch(API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({
                            fullName: formData.fullName,
                            email: formData.email,
                            role: formData.role,
                            department: formData.department,
                            status: formData.status,
                            notes: formData.notes
                        })
                    });

                    setRecords(prev => [newRecord, ...prev]);
                    showToast('✅ Synced to Google Sheet successfully!');
                    setFormData({
                        fullName: '',
                        email: '',
                        role: 'User',
                        department: 'Engineering',
                        status: 'Active',
                        notes: ''
                    });
                } catch (err) {
                    showToast('❌ Error submitting data.');
                } finally {
                    setIsSyncing(false);
                }
            };

            // Custom Modal Clear Action
            const confirmClearRecords = () => {
                setRecords([]);
                localStorage.removeItem('user_private_records');
                setShowConfirmModal(false);
                showToast('🧹 Your local history has been cleared!');
            };

            const exportToExcel = () => {
                if (records.length === 0) {
                    showToast('⚠️ No records to export!');
                    return;
                }
                const exportData = records.map(({ id, ...rest }) => rest);
                const worksheet = XLSX.utils.json_to_sheet(exportData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "My Submissions");
                XLSX.writeFile(workbook, "My_Submissions_Export.xlsx");
                showToast('📊 Exported to Excel successfully!');
            };

            return (
                <div className="max-w-4xl mx-auto p-6">
                    {/* Header Section with Right-Aligned Logo */}
                    <div className="flex justify-between items-center mb-6">
                        <h1 className="text-2xl font-bold text-cyan-400">
                            Data Entry & Google Sheet Sync
                        </h1>
                        <div className="flex items-center space-x-3">
                            {records.length > 0 && (
                                <button 
                                    type="button"
                                    onClick={() => setShowConfirmModal(true)}
                                    className="bg-rose-600 hover:bg-rose-500 text-xs font-semibold px-3 py-2 rounded transition-all text-white shadow"
                                >
                                    🗑️ Clear My History
                                </button>
                            )}
                            <button 
                                type="button"
                                onClick={exportToExcel}
                                className="bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold px-4 py-2 rounded transition-all text-white shadow"
                            >
                                📊 Export Excel
                            </button>
                            
                            {/* Logo Image */}
                            <img 
                                src="logo.png" 
                                alt="Logo" 
                                className="h-10 w-auto object-contain rounded bg-white p-1 shadow"
                                onError={(e) => { e.target.style.display = 'none'; }}
                            />
                        </div>
                    </div>

                    {toast && (
                        <div className="fixed top-5 right-5 bg-slate-800 border border-cyan-500 text-slate-100 px-4 py-3 rounded shadow-2xl z-50 animate-bounce">
                            {toast}
                        </div>
                    )}

                    {/* Custom Confirmation Modal */}
                    {showConfirmModal && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-sm w-full shadow-2xl space-y-4">
                                <div className="flex items-center space-x-3">
                                    <div className="p-2 bg-rose-500/20 text-rose-400 rounded-lg">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                                        </svg>
                                    </div>
                                    <h3 className="text-lg font-bold text-white">Clear Local History?</h3>
                                </div>
                                <p className="text-sm text-slate-300">
                                    This will clear your local view.
                                </p>
                                <div className="flex justify-end space-x-3 pt-2">
                                    <button 
                                        type="button"
                                        onClick={() => setShowConfirmModal(false)}
                                        className="px-4 py-2 rounded text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-200 transition-all"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        type="button"
                                        onClick={confirmClearRecords}
                                        className="px-4 py-2 rounded text-xs font-semibold bg-rose-600 hover:bg-rose-500 text-white transition-all shadow"
                                    >
                                        Yes, Clear
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl mb-8">
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm text-slate-300 mb-1">Full Name *</label>
                                    <input 
                                        type="text" 
                                        name="fullName" 
                                        value={formData.fullName} 
                                        onChange={handleChange} 
                                        required
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm text-slate-300 mb-1">Email Address *</label>
                                    <input 
                                        type="email" 
                                        name="email" 
                                        value={formData.email} 
                                        onChange={handleChange} 
                                        required
                                        className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500"
                                    />
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div>
                                    <label className="block text-sm text-slate-300 mb-1">Role</label>
                                    <select name="role" value={formData.role} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500">
                                        <option value="Admin">Admin</option>
                                        <option value="User">User</option>
                                        <option value="Manager">Manager</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm text-slate-300 mb-1">Department</label>
                                    <select name="department" value={formData.department} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500">
                                        <option value="Engineering">Engineering</option>
                                        <option value="Sales">Sales</option>
                                        <option value="HR">HR</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm text-slate-300 mb-1">Status</label>
                                    <select name="status" value={formData.status} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500">
                                        <option value="Active">Active</option>
                                        <option value="Inactive">Inactive</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm text-slate-300 mb-1">Notes</label>
                                <textarea name="notes" value={formData.notes} onChange={handleChange} className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-slate-100 focus:outline-none focus:border-cyan-500" rows="2"></textarea>
                            </div>

                            <button 
                                type="submit" 
                                disabled={isSyncing}
                                className="w-full bg-cyan-600 hover:bg-cyan-500 font-bold py-2.5 rounded transition-all text-white shadow-lg disabled:opacity-50"
                            >
                                {isSyncing ? 'Syncing to Sheet...' : 'Submit & Sync Data'}
                            </button>
                        </form>
                    </div>

                    {records.length > 0 && (
                        <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-lg font-bold text-slate-200">My Submitted Records</h2>
                                <span className="text-xs text-slate-400">Private to your browser</span>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm text-left text-slate-300">
                                    <thead className="text-xs uppercase bg-slate-900 text-slate-400">
                                        <tr>
                                            <th className="px-4 py-3">Timestamp</th>
                                            <th className="px-4 py-3">Name</th>
                                            <th className="px-4 py-3">Email</th>
                                            <th className="px-4 py-3">Role</th>
                                            <th className="px-4 py-3">Department</th>
                                            <th className="px-4 py-3">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-700">
                                        {records.map((rec) => (
                                            <tr key={rec.id} className="hover:bg-slate-750">
                                                <td className="px-4 py-3 text-xs text-slate-400">{rec.timestamp}</td>
                                                <td className="px-4 py-3 font-medium text-white">{rec.fullName}</td>
                                                <td className="px-4 py-3">{rec.email}</td>
                                                <td className="px-4 py-3">{rec.role}</td>
                                                <td className="px-4 py-3">{rec.department}</td>
                                                <td className="px-4 py-3">
                                                    <span className={`px-2 py-0.5 text-xs rounded ${rec.status === 'Active' ? 'bg-emerald-900/50 text-emerald-400 border border-emerald-700' : 'bg-rose-900/50 text-rose-400 border border-rose-700'}`}>
                                                        {rec.status}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
